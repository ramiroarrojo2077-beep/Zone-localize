name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [claude/photo-location-identifier-hckq5p]
    paths:
      - 'android/**'
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'exif.js'
      - '.github/workflows/apk.yml'

# Hace falta escritura para publicar el APK como Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar el APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renombrar y medir
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk zone-localize.apk
          ls -lh zone-localize.apk

      # Primero el artefacto: queda disponible aunque falle la publicación.
      - uses: actions/upload-artifact@v4
        with:
          name: zone-localize-apk
          path: zone-localize.apk
          if-no-files-found: error

      # El Release da un link de descarga directo, sin login y sin zip.
      # El tag es fijo, así que la URL /releases/latest/download/ no cambia
      # entre compilaciones.
      - name: Publicar el APK como Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTAS="APK de depuración compilado desde ${GITHUB_SHA:0:7} el $(date -u '+%Y-%m-%d %H:%M UTC').

          Descarga directa: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/zone-localize.apk

          Al instalarlo, Android pide permiso para instalar apps de origen desconocido.
          Está firmado con la clave de depuración: sirve para uso personal, no para Play Store."

          if gh release view apk-latest >/dev/null 2>&1; then
            gh release edit apk-latest --notes "$NOTAS"
          else
            gh release create apk-latest \
              --title 'Zone Localize — último APK' \
              --notes "$NOTAS" \
              --target "$GITHUB_SHA"
          fi

          gh release upload apk-latest zone-localize.apk --clobber

      # Segunda vía de descarga, por raw.githubusercontent.com. Se actualiza
      # acá para que no sirva un APK viejo. El filtro de "paths" no incluye
      # dist/, así que este push no vuelve a disparar el workflow.
      - name: Actualizar la copia en dist/
        run: |
          set -euo pipefail
          cp zone-localize.apk dist/zone-localize.apk
          if git diff --quiet -- dist/zone-localize.apk; then
            echo "El APK no cambió; no hay nada que commitear."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/zone-localize.apk
          git commit -m "Actualizar el APK de dist/ desde ${GITHUB_SHA:0:7} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
