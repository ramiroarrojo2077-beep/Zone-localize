name: Publicar en GitHub Pages

on:
  push:
    branches: [claude/photo-location-identifier-hckq5p]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue por vez; no se cancelan los que ya están corriendo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Armar el sitio
        run: |
          mkdir -p _site
          cp index.html styles.css app.js exif.js _site/

      # enablement: true habilita Pages en el repo si todavía está apagado.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
