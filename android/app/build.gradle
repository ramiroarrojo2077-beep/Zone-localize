plugins {
    id 'com.android.application'
}

// La página vive en la raíz del repo: se copia a los assets al compilar
// para no tener dos copias de los mismos archivos.
def webAssets = layout.buildDirectory.dir('webAssets')

def copyWebApp = tasks.register('copyWebApp', Copy) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html', 'styles.css', 'app.js', 'exif.js'
    }
    into webAssets
}

android {
    namespace 'com.zonelocalize'
    compileSdk 35

    defaultConfig {
        applicationId 'com.zonelocalize'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    sourceSets {
        main {
            assets.srcDirs += webAssets.get().asFile
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

tasks.named('preBuild') { dependsOn copyWebApp }

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.activity:activity:1.9.3'
}
