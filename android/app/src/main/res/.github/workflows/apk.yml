name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [claude/photo-location-identifier-hckq5p]
    paths:
      - 'android/**'
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'exif.js'
      - '.github/workflows/apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar el APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renombrar y medir
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk zone-localize.apk
          ls -lh zone-localize.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zone-localize-apk
          path: zone-localize.apk
          if-no-files-found: error
